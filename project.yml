name: Gastown
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
settings:
  DEVELOPMENT_TEAM: QMM486NPYC
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "2.0.0"
  CURRENT_PROJECT_VERSION: "202610211135"
targets:
  Gastown:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "AppiOS/**"
      - path: Resources
        buildPhase: resources
      - path: Gastown.icon
    settings:
      PRODUCT_NAME: "Gastown"
      PRODUCT_MODULE_NAME: Gastown
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.nyc
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: Gastown
      INFOPLIST_KEY_CFBundleDisplayName: "Gastown"
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
      CODE_SIGN_ENTITLEMENTS: Resources/Gastown.entitlements
      ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - SimTests
  Gastown-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "App/**"
          - "AppiOS/**"
      - path: Sources/AppiOS
      - path: Resources
        buildPhase: resources
      - path: Gastown.icon
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.nyc
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: Resources/Info-iOS.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: Gastown
      INFOPLIST_KEY_CFBundleDisplayName: "Gastown"
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
      TARGETED_DEVICE_FAMILY: "1,2"
  SimTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Gastown
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.nyc.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Gastown.app/Contents/MacOS/Gastown"
      BUNDLE_LOADER: "$(TEST_HOST)"
